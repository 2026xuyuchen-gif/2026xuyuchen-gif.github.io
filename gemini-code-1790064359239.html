<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后宫争宠大富翁 - 联机控场版</title>
  <style>
    :root {
      --bg-color: #1a0f12;
      --panel-bg: rgba(35, 20, 25, 0.92);
      --gold-color: #ffd700;
      --red-color: #d9383a;
      --border-color: #b8860b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", "Microsoft YaHei", serif; }
    body { background-color: var(--bg-color); color: #f0e6d2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }

    /* 顶部导航与身份指示 */
    header { width: 100%; background: #2a1215; border-bottom: 2px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; color: var(--gold-color); letter-spacing: 2px; }
    .role-badge { padding: 4px 12px; border-radius: 12px; font-size: 14px; border: 1px solid var(--border-color); }
    .badge-host { background: #b8860b; color: #fff; }
    .badge-player { background: #5c2427; color: var(--gold-color); }

    /* 入口选择与弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-card { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 25px; width: 90%; max-width: 500px; box-shadow: 0 0 30px rgba(184, 134, 11, 0.3); }
    .tab-header { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #aaa; font-size: 16px; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--gold-color); border-bottom-color: var(--gold-color); font-weight: bold; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: var(--gold-color); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(180deg, #d4af37, #b8860b); border: none; color: #1a0f12; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { filter: brightness(1.1); }

    /* 主界面布局 */
    .main-container { width: 100%; max-width: 1400px; padding: 15px; display: grid; grid-template-columns: 1fr 340px; gap: 15px; }
    @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

    /* 地图面板 */
    .board-panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 75vh; overflow-y: auto; padding: 5px; }
    .tile { background: #34191c; border: 1px solid #5c2e32; border-radius: 6px; padding: 8px; min-height: 85px; display: flex; flex-direction: column; justify-content: space-between; position: relative; font-size: 12px; }
    .tile.active { border-color: var(--gold-color); box-shadow: 0 0 10px var(--gold-color); }
    .tile-name { font-weight: bold; color: var(--gold-color); text-align: center; }
    .tile-desc { color: #ccc; font-size: 10px; text-align: center; margin-top: 2px; }
    .tile-players { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
    .p-token { font-size: 10px; padding: 1px 4px; background: var(--red-color); color: #fff; border-radius: 3px; }

    /* 右侧/控场面板 */
    .side-panel { display: flex; flex-direction: column; gap: 15px; }
    .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .card-title { font-size: 16px; color: var(--gold-color); margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid rgba(184,134,11,0.3); padding-bottom: 5px; }

    /* 主持人红警区 */
    .alert-box { background: rgba(217, 56, 58, 0.2); border: 1px solid var(--red-color); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .alert-title { color: #ff6b6b; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 5px; }
    .alert-item { font-size: 12px; color: #ffcccc; margin-top: 4px; padding: 4px; background: rgba(0,0,0,0.3); border-radius: 3px; }

    /* 控制区 */
    .dice-section { text-align: center; }
    .dice-val { font-size: 48px; font-weight: bold; color: var(--gold-color); margin: 10px 0; }
    .btn-dice { width: 100%; padding: 15px; background: #990000; color: #fff; border: 1px solid var(--gold-color); font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-dice:disabled { background: #444; border-color: #666; color: #888; cursor: not-allowed; }
    .btn-host-ctrl { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; font-weight: bold; font-size: 15px; border-radius: 6px; cursor: pointer; margin-bottom: 8px; }

    /* 玩家列表表格 */
    .p-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .p-table th, .p-table td { border: 1px solid #4a2629; padding: 6px; text-align: center; }
    .p-table th { background: #2a1215; color: var(--gold-color); }

    /* 破产充值弹窗 */
    .recharge-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
  </style>
</head>
<body>

  <header>
    <div class="logo">📜 后宫争宠大富翁</div>
    <div id="roleBadge" class="role-badge badge-player">未登录</div>
  </header>

  <!-- 登录/选择身份弹窗 -->
  <div id="authModal" class="modal-overlay">
    <div class="auth-card">
      <div class="tab-header">
        <button class="tab-btn active" id="tabHostBtn" onclick="switchTab('host')">👑 主持人入口 (直接建房)</button>
        <button class="tab-btn" id="tabPlayerBtn" onclick="switchTab('player')">📜 玩家登记入局</button>
      </div>

      <!-- 主持人建房界面 -->
      <div id="hostTab">
        <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">主持人无需填写个人游戏数据，拥有全程控制与全景监视权限。</p>
        <div class="form-group">
          <label>设定房间号 (Room Code)</label>
          <input type="text" id="hostRoomInput" value="8888">
        </div>
        <button class="btn-submit" onclick="initHost()">👑 开启房间 (进入主持人控制台)</button>
      </div>

      <!-- 玩家填表界面 -->
      <div id="playerTab" style="display: none;">
        <div class="form-group">
          <label>玩家姓名 / 封号 *</label>
          <input type="text" id="pName" placeholder="如：甄嬛 / 华妃">
        </div>
        <div class="grid-2">
          <div class="form-group"><label>体质 *</label><input type="number" id="pBody" value="80"></div>
          <div class="form-group"><label>容貌</label><input type="number" id="pBeauty" value="80"></div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>才艺</label><input type="number" id="pTalent" value="70"></div>
          <div class="form-group"><label>威望</label><input type="number" id="pPrestige" value="50"></div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>初始积分</label><input type="number" id="pScore" value="10"></div>
          <div class="form-group"><label>房间号</label><input type="text" id="pRoom" value="8888"></div>
        </div>
        <button class="btn-submit" onclick="initPlayer()">奉旨入宫 (开始游戏)</button>
      </div>
    </div>
  </div>

  <!-- 破产充值弹窗 -->
  <div id="rechargeModal" class="recharge-modal" style="display: none;">
    <div class="auth-card" style="text-align: center;">
      <h2 style="color: var(--red-color); margin-bottom: 10px;">⚠️ 您已破产！</h2>
      <p style="font-size: 14px; margin-bottom: 15px; color: #eee;">您的金币不足以支付门票/费用，是否要进行充值？</p>
      <div class="form-group">
        <label>请输入虚拟充值金币数额：</label>
        <input type="number" id="rechargeAmount" value="100" style="text-align: center; font-size: 18px; font-weight: bold;">
      </div>
      <button class="btn-submit" onclick="confirmRecharge()">确认充值并继续</button>
    </div>
  </div>

  <!-- 主游戏界面 -->
  <div class="main-container">
    <!-- 左侧地图 -->
    <div class="board-panel">
      <div class="card-title">🗺️ 后宫地图 (54格)</div>
      <div class="map-grid" id="mapBoard"></div>
    </div>

    <!-- 右侧控制/监控面板 -->
    <div class="side-panel">
      
      <!-- 主持人高亮红警面板 -->
      <div id="hostAlertCard" class="card" style="display: none; border-color: var(--red-color);">
        <div class="alert-title">🚨 主持人重点提醒：破产/充值记录</div>
        <div id="alertList">
          <div style="font-size: 11px; color: #aaa;">暂无玩家破产充值...</div>
        </div>
      </div>

      <!-- 主持人控场工具 -->
      <div id="hostControlCard" class="card" style="display: none;">
        <div class="card-title">👑 主持人控制台</div>
        <button class="btn-host-ctrl" onclick="hostUnlockDice()">🔓 允许当前玩家掷骰子</button>
        <button class="btn-host-ctrl" style="background: #e67e22;" onclick="hostNextTurn()">⏭️ 强制切到下一位</button>
        <button class="btn-host-ctrl" style="background: #8e44ad;" onclick="copyHostLink()">🔗 复制主持人模式专属链接</button>
      </div>

      <!-- 玩家掷骰区 -->
      <div id="playerControlCard" class="card">
        <div class="card-title">🎲 回合掷骰</div>
        <div class="dice-section">
          <div class="dice-val" id="diceDisplay">-</div>
          <button id="rollBtn" class="btn-dice" onclick="playerRoll()" disabled>等待主持人发令...</button>
        </div>
      </div>

      <!-- 监控/全员数据表 -->
      <div class="card">
        <div class="card-title">👥 宫中各位小主动态 (房间: <span id="roomDisplay">8888</span>)</div>
        <table class="p-table">
          <thead>
            <tr>
              <th>小主</th>
              <th>金币</th>
              <th>体质</th>
              <th>容貌</th>
              <th>才艺</th>
              <th>威望</th>
            </tr>
          </thead>
          <tbody id="playerTableBody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    // 54个宫殿地图定义
    const TILES = [
      { name: "起始点", type: "start", desc: "起驾发祥地" },
      { name: "祈福台", type: "event", desc: "祈求圣恩" },
      { name: "衍庆宫", type: "toll", cost: 10, desc: "门票10两" },
      { name: "勤政殿", type: "buff", desc: "送汤帝好感+5" },
      { name: "长信宫", type: "toll", cost: 10, desc: "门票10两" },
      { name: "剧情卡", type: "card", desc: "线下剧情线下说" },
      { name: "瑶华宫", type: "debuff", desc: "打扰惠妃 体质-5" },
      { name: "桃水源", type: "event", desc: "景色太美 暂停2回合" },
      { name: "获得秘药", type: "buff", desc: "体质大增" },
      { name: "长乐宫", type: "toll", cost: 10, desc: "门票10两" },
      { name: "冷宫", type: "debuff", desc: "暂停三回合" },
      { name: "无事发生", type: "none", desc: "平安无事" },
      { name: "肉肴府", type: "cost", cost: 50, desc: "贿赂公公 金-50" },
      { name: "内务府", type: "event", desc: "领取例银" },
      { name: "棠梨宫", type: "toll", cost: 20, desc: "门票20两" },
      { name: "前进两格", type: "move", step: 2, desc: "快速快进" },
      { name: "翊坤宫", type: "toll", cost: 40, desc: "门票40两" },
      { name: "宝华楼", type: "event", desc: "可祈愿一次" },
      { name: "藏书楼", type: "buff", desc: "金+20" },
      { name: "教坊司", type: "buff", desc: "才艺+10" },
      { name: "安胎药", type: "buff", desc: "体质增加" },
      { name: "得不偿失", type: "cost", cost: 30, desc: "金-30" },
      { name: "终极大奖", type: "buff", desc: "积分+30" },
      { name: "幸运卡", type: "card", desc: "容貌+5" },
      { name: "加倍卡", type: "card", desc: "点数翻倍" },
      { name: "御膳房", type: "buff", desc: "帝好感+10" },
      { name: "好运卡", type: "card", desc: "免下一次门票" },
      { name: "永华宫", type: "toll", cost: 20, desc: "门票20两" },
      { name: "宫道", type: "buff", desc: "威望+10" },
      { name: "拔得头筹", type: "buff", desc: "寝+1" },
      { name: "华清宫", type: "toll", cost: 20, desc: "门票20两" },
      { name: "太医院", type: "buff", desc: "平安脉体质+5" },
      { name: "凌云亭", type: "buff", desc: "偶遇帝好感+5" },
      { name: "鲤鱼池", type: "debuff", desc: "冲好感-20" },
      { name: "仙石林", type: "buff", desc: "威望+5" },
      { name: "沉春湖", type: "debuff", desc: "落水体质-5" },
      { name: "祈福台", type: "event", desc: "再次祈福" },
      { name: "后退三格", type: "move", step: -3, desc: "倒退三步" },
      { name: "御花园", type: "card", desc: "抽福祸卡" },
      { name: "簪玉阁", type: "cost", cost: 20, desc: "得珠钗一支" },
      { name: "机遇楼", type: "buff", desc: "福运值+3 再投一次" },
      { name: "艺园", type: "buff", desc: "任意才艺+5" },
      { name: "九曲长廊", type: "event", desc: "偶遇赠金20" },
      { name: "摘星楼", type: "debuff", desc: "白跑体质-3" },
      { name: "关雎宫", type: "toll", cost: 20, desc: "门票20两" },
      { name: "道具卡", type: "card", desc: "抽取道具" },
      { name: "休沐亭", type: "debuff", desc: "暂停一回合" },
      { name: "掠夺卡", type: "card", desc: "掠夺后方50两" },
      { name: "后退六格", type: "move", step: -6, desc: "后退六格" },
      { name: "福利卡", type: "card", desc: "积分+10" },
      { name: "回到起点", type: "move", target: 0, desc: "直接归零" },
      { name: "移动卡", type: "card", desc: "移动到前一位" },
      { name: "甘泉宫", type: "toll", cost: 20, desc: "门票20两" },
      { name: "前进三格", type: "move", step: 3, desc: "前进三格" }
    ];

    // 全局状态
    let roomCode = "8888";
    let isHost = false;
    let myName = "";
    let channel = null;

    let gameState = {
      turnIndex: 0,
      diceUnlocked: false,
      players: [], // { name, gold, body, beauty, talent, prestige, score, pos, recharges: [] }
      alertLogs: []
    };

    // 检查URL参数(?role=host)
    window.onload = function() {
      renderMap();
      const params = new URLSearchParams(window.location.search);
      if (params.get('role') === 'host') {
        document.getElementById('hostRoomInput').value = params.get('room') || '8888';
        initHost();
      }
    };

    function switchTab(type) {
      document.getElementById('tabHostBtn').classList.toggle('active', type === 'host');
      document.getElementById('tabPlayerBtn').classList.toggle('active', type === 'player');
      document.getElementById('hostTab').style.display = type === 'host' ? 'block' : 'none';
      document.getElementById('playerTab').style.display = type === 'player' ? 'block' : 'none';
    }

    // 初始化 BroadcastChannel 多标签/多窗口实时同步
    function setupChannel() {
      channel = new BroadcastChannel('harem_room_' + roomCode);
      channel.onmessage = (e) => {
        gameState = e.data;
        updateUI();
      };
    }

    function syncState() {
      if (channel) channel.postMessage(gameState);
      updateUI();
    }

    // 初始化主持人
    function initHost() {
      isHost = true;
      roomCode = document.getElementById('hostRoomInput').value || '8888';
      setupChannel();

      document.getElementById('authModal').style.display = 'none';
      document.getElementById('roleBadge').className = 'role-badge badge-host';
      document.getElementById('roleBadge').innerText = '👑 主持人控场';
      document.getElementById('hostControlCard').style.display = 'block';
      document.getElementById('hostAlertCard').style.display = 'block';
      document.getElementById('playerControlCard').style.display = 'none';
      document.getElementById('roomDisplay').innerText = roomCode;

      syncState();
    }

    // 初始化玩家
    function initPlayer() {
      myName = document.getElementById('pName').value.trim();
      if (!myName) { alert('请输入小主封号/姓名！'); return; }

      roomCode = document.getElementById('pRoom').value || '8888';
      setupChannel();

      const newPlayer = {
        name: myName,
        gold: 100, // 开场100金子
        body: parseInt(document.getElementById('pBody').value) || 80,
        beauty: parseInt(document.getElementById('pBeauty').value) || 80,
        talent: parseInt(document.getElementById('pTalent').value) || 70,
        prestige: parseInt(document.getElementById('pPrestige').value) || 50,
        score: parseInt(document.getElementById('pScore').value) || 10,
        pos: 0
      };

      const existingIdx = gameState.players.findIndex(p => p.name === myName);
      if (existingIdx >= 0) {
        gameState.players[existingIdx] = newPlayer;
      } else {
        gameState.players.push(newPlayer);
      }

      document.getElementById('authModal').style.display = 'none';
      document.getElementById('roleBadge').className = 'role-badge badge-player';
      document.getElementById('roleBadge').innerText = '📜 玩家: ' + myName;
      document.getElementById('roomDisplay').innerText = roomCode;

      syncState();
    }

    // 主持人解锁掷骰
    function hostUnlockDice() {
      if (gameState.players.length === 0) { alert('尚无玩家入局！'); return; }
      gameState.diceUnlocked = true;
      syncState();
    }

    // 主持人强制切下一位
    function hostNextTurn() {
      if (gameState.players.length === 0) return;
      gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
      gameState.diceUnlocked = false;
      syncState();
    }

    // 复制主持人专属链接
    function copyHostLink() {
      const link = window.location.origin + window.location.pathname + '?role=host&room=' + roomCode;
      navigator.clipboard.writeText(link);
      alert('主持人模式专属链接已复制到剪贴板！\n' + link);
    }

    // 玩家掷骰
    function playerRoll() {
      const curPlayer = gameState.players[gameState.turnIndex];
      if (!curPlayer || curPlayer.name !== myName) { alert('尚未轮到您的回合！'); return; }
      if (!gameState.diceUnlocked) { alert('请等待主持人开启本回合！'); return; }

      const dice = Math.floor(Math.random() * 6) + 1;
      document.getElementById('diceDisplay').innerText = dice;

      // 移动
      curPlayer.pos = (curPlayer.pos + dice) % TILES.length;
      const tile = TILES[curPlayer.pos];

      // 处理扣金币/门票
      if (tile.cost) {
        if (curPlayer.gold < tile.cost) {
          // 触发破产充值弹窗
          document.getElementById('rechargeModal').style.display = 'flex';
          gameState.diceUnlocked = false;
          return;
        } else {
          curPlayer.gold -= tile.cost;
        }
      }

      // 线下卡牌提醒
      if (tile.type === 'card') {
        alert(`【抽到卡牌】：小主落在了 [${tile.name}]！具体卡牌效果与剧情请与主持人线下沟通。`);
      }

      // 切到下一位
      gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
      gameState.diceUnlocked = false;
      syncState();
    }

    // 确认充值
    function confirmRecharge() {
      const amount = parseInt(document.getElementById('rechargeAmount').value) || 100;
      const curPlayer = gameState.players.find(p => p.name === myName);
      if (curPlayer) {
        curPlayer.gold += amount;
        
        // 记录给主持人的警报
        const logMsg = `⚠️ 玩家 [${curPlayer.name}] 曾经破产，并进行了虚拟充值 ${amount} 金币！`;
        gameState.alertLogs.unshift(logMsg);

        alert(`充值成功！当前金币：${curPlayer.gold}`);
      }
      document.getElementById('rechargeModal').style.display = 'none';

      // 完成本回合切下位
      gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
      gameState.diceUnlocked = false;
      syncState();
    }

    // 渲染地图
    function renderMap() {
      const board = document.getElementById('mapBoard');
      board.innerHTML = '';
      TILES.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'tile';
        div.id = 'tile-' + i;
        div.innerHTML = `
          <div>
            <div class="tile-name">${t.name}</div>
            <div class="tile-desc">${t.desc}</div>
          </div>
          <div class="tile-players" id="tile-players-${i}"></div>
        `;
        board.appendChild(div);
      });
    }

    // 刷新界面 UI
    function updateUI() {
      // 1. 渲染地图上的玩家位置
      TILES.forEach((_, i) => {
        const pContainer = document.getElementById(`tile-players-${i}`);
        if (pContainer) pContainer.innerHTML = '';
      });

      gameState.players.forEach(p => {
        const pContainer = document.getElementById(`tile-players-${p.pos}`);
        if (pContainer) {
          const badge = document.createElement('span');
          badge.className = 'p-token';
          badge.innerText = p.name;
          pContainer.appendChild(badge);
        }
      });

      // 2. 渲染玩家数据表格
      const tbody = document.getElementById('playerTableBody');
      tbody.innerHTML = '';
      gameState.players.forEach((p, idx) => {
        const isCurrent = idx === gameState.turnIndex;
        const tr = document.createElement('tr');
        if (isCurrent) tr.style.background = 'rgba(184, 134, 11, 0.2)';
        tr.innerHTML = `
          <td>${isCurrent ? '👉 ' : ''}${p.name}</td>
          <td style="color:var(--gold-color); font-weight:bold;">${p.gold}</td>
          <td>${p.body}</td>
          <td>${p.beauty}</td>
          <td>${p.talent}</td>
          <td>${p.prestige}</td>
        `;
        tbody.appendChild(tr);
      });

      // 3. 更新掷骰按钮状态
      const rollBtn = document.getElementById('rollBtn');
      const curPlayer = gameState.players[gameState.turnIndex];
      if (!isHost) {
        if (curPlayer && curPlayer.name === myName) {
          if (gameState.diceUnlocked) {
            rollBtn.disabled = false;
            rollBtn.innerText = '🎲 掷骰子';
          } else {
            rollBtn.disabled = true;
            rollBtn.innerText = '等待主持人发令...';
          }
        } else {
          rollBtn.disabled = true;
          rollBtn.innerText = curPlayer ? `等待 [${curPlayer.name}] 掷骰...` : '等待玩家...';
        }
      }

      // 4. 更新主持人红警区
      if (isHost) {
        const alertList = document.getElementById('alertList');
        if (gameState.alertLogs.length > 0) {
          alertList.innerHTML = gameState.alertLogs.map(log => `<div class="alert-item">${log}</div>`).join('');
        } else {
          alertList.innerHTML = `<div style="font-size: 11px; color: #aaa;">暂无玩家破产充值记录...</div>`;
        }
      }
    }
  </script>
</body>
</html>
